; Arduino Uno + MCP2515/TJA1050 CAN module, USB<->CAN bridge.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -D ECHO_TEST_MODE=0
lib_deps =
	coryjfowler/mcp_can@^1.5.1

; Builds the Phase 1 HW connectivity echo test instead of the default
; simulated OBD-II ECU. Use: platformio run -e uno_echo_test -t upload
[env:uno_echo_test]
extends = env:uno
build_flags = -D ECHO_TEST_MODE=1
